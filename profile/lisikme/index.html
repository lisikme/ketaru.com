<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="yandex-verification" content="2d8c1dcb18ad48b7">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Профиль разработчика lisik.me — KetaruCorp">
    <meta property="og:title" content="Профиль разработчика | KetaRu">
    <meta property="og:site_name" content="KetaRu">
    <meta property="og:url" content="https://krcorp.ru/profile/lisikme">
    <meta property="og:description" content="Профиль разработчика lisik.me">
    <meta property="og:image" content="./avatar.gif">

    <title>KetaRu | Профиль разработчика</title>
    <link rel="shortcut icon" href="https://krcorp.ru/icon/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../../css/ketame.css?v=3">
</head>
<body>
    <header id="site-header">
        <div id="site-header-box">
            <a id="site-logo-link" href="https://krcorp.ru" target="_blank" rel="noopener noreferrer">
                <div id="site-logo-box2">
                    <img id="site-logo-img" src="https://krcorp.ru/corp.png" alt="KR Corp">
                    <name id="site-logo-name2">
                        <div id="tesx2">
                            <span id="ketaru2">KR</span>
                            <span id="corp2">Corp</span>
                        </div>
                    <span id="ketame-by">by kelix.me</span>
                    </name>
                </div>
            </a>
            <type id="page-name">
                <span id="namm">Lisichka</span>
                <span class="kt-sub">Профиль разработчика</span>
            </type>
            <span id="rel">BETA</span>
        </div>
    </header>

    <main class="kt-wrap">
        <section class="kt-hero">
            <img class="kt-avatar" src="./avatar.gif" alt="lisik.me">
            <h1 class="kt-title">Lisichka</h1>
            <p class="kt-sub">Разработчик с 2017 года. Основатель проекта KetaruCorp.</p>
            <div class="kt-actions">
                <a class="kt-btn kt-btn--light" href="./build">Конфигурация</a>
                <a class="kt-btn" href="./join" target="_blank" rel="noopener noreferrer">Discord</a>
            </div>
        </section>

        <section class="kt-card">
            <div class="kt-card__head">Ссылки</div>
            <div class="kt-grid">
                <a class="kt-tile" href="https://krcorp.ru/steam" target="_blank" rel="noopener noreferrer">
                    <div class="kt-tile__info">
                        <div class="kt-tile__title">Steam · Lisichka (RU)</div>
                        <div class="kt-tile__tag">Основной аккаунт</div>
                    </div>
                </a>
                <a class="kt-tile" href="https://krcorp.ru/steam1" target="_blank" rel="noopener noreferrer">
                    <div class="kt-tile__info">
                        <div class="kt-tile__title">Steam · LisikMe ♥</div>
                        <div class="kt-tile__tag">Твинк-аккаунт</div>
                    </div>
                </a>
                <a class="kt-tile" href="https://krcorp.ru/tiktok" target="_blank" rel="noopener noreferrer">
                    <div class="kt-tile__info">
                        <div class="kt-tile__title">TikTok</div>
                        <div class="kt-tile__tag">@lisik.me</div>
                    </div>
                </a>
                <a class="kt-tile" href="https://krcorp.ru/youtube" target="_blank" rel="noopener noreferrer">
                    <div class="kt-tile__info">
                        <div class="kt-tile__title">YouTube</div>
                        <div class="kt-tile__tag">MoriX</div>
                    </div>
                </a>
                <a class="kt-tile" href="https://krcorp.ru/vk" target="_blank" rel="noopener noreferrer">
                    <div class="kt-tile__info">
                        <div class="kt-tile__title">VK</div>
                        <div class="kt-tile__tag">Морека Пушистая</div>
                    </div>
                </a>
            </div>
        </section>
    </main>
</body>
</html>
